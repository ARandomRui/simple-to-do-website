<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A flexible multi-list to-do application with task details and notes.">
    <title>To-Do Lists</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="app-header">
        <h1>My Lists</h1>
        <button id="btn-new-list" title="Create a new list">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            New List
        </button>
    </header>

    <main id="list-container"></main>

    <!-- Task Detail Modal -->
    <div id="task-modal-overlay" class="modal-overlay hidden">
        <div id="task-modal" class="modal">
            <div class="modal-header">
                <h2 id="modal-task-title"></h2>
                <button id="btn-modal-close" class="btn-icon" title="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <label for="modal-notes" class="modal-label">Notes</label>
            <textarea id="modal-notes" placeholder="Add detailed notes here..."></textarea>
            <div class="modal-footer">
                <button id="btn-modal-save" class="btn-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripts loaded in dependency order -->
    <script src="js/storageManager.js"></script>
    <script src="js/layoutManager.js"></script>
    <script src="js/modalManager.js"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/listManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
